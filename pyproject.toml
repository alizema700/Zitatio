[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zitatio"
version = "0.1.0"
description = "Prüfschicht für Due-Diligence-Berichte: jede Aussage gegen den Datenraum geprüft."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf[crypto]>=4"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "fpdf2>=2.7", "openpyxl>=3.1", "httpx>=0.27"]

[project.scripts]
zitatio = "zitatio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zitatio = ["assets/*.svg", "assets/*.html", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
